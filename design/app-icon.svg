<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <linearGradient id="rim" x1="10%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#F3F6F8"/>
      <stop offset="35%" stop-color="#C7D0D6"/>
      <stop offset="60%" stop-color="#8C99A2"/>
      <stop offset="100%" stop-color="#4A5560"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="15%">
      <stop offset="0%" stop-color="#2A333B"/>
      <stop offset="48%" stop-color="#1D242A"/>
      <stop offset="52%" stop-color="#161B20"/>
      <stop offset="100%" stop-color="#0E1215"/>
    </linearGradient>
    <radialGradient id="iris" cx="34%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#A6F3F6"/>
      <stop offset="45%" stop-color="#4FCBD4"/>
      <stop offset="100%" stop-color="#0E7C89"/>
    </radialGradient>
    <clipPath id="shieldClip">
      <path d="M256,34 C322,34 384,56 434,97 C452,112 452,138 452,172 L452,226 C452,330 398,412 256,480 C114,412 60,330 60,226 L60,172 C60,138 60,112 78,97 C128,56 190,34 256,34 Z"/>
    </clipPath>
  </defs>

  <!-- underside sliver for depth -->
  <path d="M256,40 C322,40 384,62 434,103 C452,118 452,144 452,178 L452,232 C452,338 398,420 256,488 C114,420 60,338 60,232 L60,178 C60,144 60,118 78,103 C128,62 190,40 256,40 Z" fill="#0A1218"/>

  <!-- metallic rim -->
  <path d="M256,34 C322,34 384,56 434,97 C452,112 452,138 452,172 L452,226 C452,330 398,412 256,480 C114,412 60,330 60,226 L60,172 C60,138 60,112 78,97 C128,56 190,34 256,34 Z" fill="url(#rim)"/>

  <!-- dark inner panel (inset) -->
  <g transform="translate(256,257) scale(0.885) translate(-256,-257)">
    <path d="M256,34 C322,34 384,56 434,97 C452,112 452,138 452,172 L452,226 C452,330 398,412 256,480 C114,412 60,330 60,226 L60,172 C60,138 60,112 78,97 C128,56 190,34 256,34 Z" fill="url(#panel)"/>
  </g>

  <!-- concentric emblem, clipped to shield so nothing overflows the point -->
  <g clip-path="url(#shieldClip)">
    <circle cx="256" cy="250" r="112" fill="url(#rim)"/>
    <circle cx="256" cy="250" r="94" fill="#141A1E"/>
    <circle cx="256" cy="250" r="76" fill="url(#rim)"/>
    <circle cx="256" cy="250" r="62" fill="#10151A"/>
    <circle cx="256" cy="250" r="54" fill="url(#iris)"/>
    <circle cx="270" cy="266" r="19" fill="#0A1216"/>
    <circle cx="232" cy="221" r="12.5" fill="#EAFBFC" opacity="0.92"/>
  </g>
</svg>
