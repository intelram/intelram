name: NetSteer APK

on:
  push:
    branches: [claude/determined-ride-izevb8]
    paths: ["netsteer/**", ".github/workflows/netsteer-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netsteer
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK (ANDROID_HOME) with licenses accepted;
      # AGP installs any missing platform/build-tools on first build.

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NetSteer-debug-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NetSteer-debug-apk
          path: netsteer/NetSteer-debug-${{ github.run_number }}.apk

      - name: Publish pre-release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: netsteer-debug-${{ github.run_number }}
          name: NetSteer debug build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Debug-signed APK of NetSteer (Wi-Fi/cellular failover & network manager, not bandwidth bonding).
            Install: download the APK on the phone, allow "Install unknown apps" for your browser/file manager, open it.
            Or: `adb install -r NetSteer-debug-${{ github.run_number }}.apk`
          files: netsteer/NetSteer-debug-${{ github.run_number }}.apk
